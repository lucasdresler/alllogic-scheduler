services:
  scheduler:
    build:
      context: .
    container_name: alllogic-scheduler
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxy
      - matriz-saas_matriz-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.scheduler.entrypoints=websecure
      - traefik.http.routers.scheduler.rule=Host(`agenda.agillex.com.br`) || Host(`agenda.alllogiconline.com.br`)
      - traefik.http.routers.scheduler.tls=true
      - traefik.http.routers.scheduler.tls.certresolver=letsencrypt
      - traefik.http.services.scheduler.loadbalancer.server.port=8000

networks:
  proxy:
    external: true
  matriz-saas_matriz-network:
    external: true

{% extends "base.html" %}

{% block titulo %}Painel Admin — Barbearia Top{% endblock %}

{% block conteudo %}
<div class="container">
    <header class="topo">
        <h1>Painel Admin</h1>
        <p>{{ nome_estabelecimento }}</p>
    </header>

    {% if erro %}
    <div class="mensagem-erro">{{ erro }}</div>
    {% endif %}

    <div class="card">
        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="admin" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>

            <button type="submit" class="btn-primario">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
